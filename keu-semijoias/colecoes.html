<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coleções | Keu Semijoias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="colecoes">
    <div id="site-header"></div>
    <main>
      <section class="page-hero">
        <div class="container">
          <p class="kicker">Coleções</p>
          <h1>Encontre sua peça</h1>
          <p>
            Cada coleção foi criada para um momento. Escolha a que ressoa com o seu
            estilo — clássico, brilho, encanto ou essencial.
          </p>
        </div>
      </section>
      <section class="section bg-bg">
        <div class="container">
          <div class="grid-2" id="collections-grid"></div>
        </div>
      </section>
      <section class="section bg-bg" style="padding-top:0">
        <div class="container">
          <h2 class="section-title mb-6">Todas as peças</h2>
          <div class="filter-bar">
            <button type="button" class="is-on" data-filter="all">Todas</button>
            <button type="button" data-filter="classicos">Clássicos</button>
            <button type="button" data-filter="brilho">Brilho</button>
            <button type="button" data-filter="encanto">Encanto</button>
            <button type="button" data-filter="essenciais">Essenciais</button>
          </div>
          <div class="grid-products" id="all-products"></div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
