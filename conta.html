<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minha conta | Keu Semijoias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="conta">
    <div id="site-header"></div>
    <main>
      <section class="page-hero">
        <div class="container center">
          <p class="kicker">Minha conta</p>
          <h1>Bem-vinda de volta</h1>
          <p style="margin: 0 auto">Acompanhe pedidos, favoritos e cadastro.</p>
        </div>
      </section>
      <section class="section bg-bg" style="padding-top: 0">
        <div class="container">
          <div class="account-card">
            <div class="tabs">
              <button type="button" class="is-on" id="tab-login">Entrar</button>
              <button type="button" id="tab-cadastro">Cadastrar</button>
            </div>
            <form class="form-stack" data-account id="form-login">
              <div>
                <label for="login-email">E-mail</label>
                <input class="field-input" id="login-email" type="email" required />
              </div>
              <div>
                <label for="login-pass">Senha</label>
                <input class="field-input" id="login-pass" type="password" required />
              </div>
              <button class="btn btn-primary btn-full" type="submit">Entrar</button>
            </form>
            <form class="form-stack" data-account id="form-cadastro" hidden>
              <div>
                <label for="cad-nome">Nome</label>
                <input class="field-input" id="cad-nome" required />
              </div>
              <div>
                <label for="cad-email">E-mail</label>
                <input class="field-input" id="cad-email" type="email" required />
              </div>
              <div>
                <label for="cad-pass">Senha</label>
                <input class="field-input" id="cad-pass" type="password" required />
              </div>
              <button class="btn btn-primary btn-full" type="submit">Criar conta</button>
            </form>
            <p style="margin-top: 1.25rem; font-size: 0.8rem; color: var(--color-muted); text-align: center">
              Área demonstrativa para apresentação à cliente. No site final, integra login, pedidos e rastreio.
            </p>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.getElementById("tab-login").addEventListener("click", function () {
        this.classList.add("is-on");
        document.getElementById("tab-cadastro").classList.remove("is-on");
        document.getElementById("form-login").hidden = false;
        document.getElementById("form-cadastro").hidden = true;
      });
      document.getElementById("tab-cadastro").addEventListener("click", function () {
        this.classList.add("is-on");
        document.getElementById("tab-login").classList.remove("is-on");
        document.getElementById("form-login").hidden = true;
        document.getElementById("form-cadastro").hidden = false;
      });
    </script>
  </body>
</html>
