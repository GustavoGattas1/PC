<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel Administrativo | Keu Semijoias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="admin-body">
    <section class="admin-login" id="login-screen">
      <div class="login-card">
        <p class="kicker">Keu Semijoias</p>
        <h1>Painel Administrativo</h1>
        <p style="color: var(--color-muted); font-size: 0.9rem; margin-bottom: 0.5rem">
          Gerencie produtos, pedidos e o conteúdo da loja.
        </p>
        <div class="login-hint">
          Acesso de demonstração<br />
          E-mail: <strong>admin@keusemijoias.com.br</strong><br />
          Senha: <strong>keu123</strong>
        </div>
        <form class="form-stack" id="login-form">
          <div>
            <label for="admin-email">E-mail</label>
            <input class="field-input" id="admin-email" type="email" required value="admin@keusemijoias.com.br" />
          </div>
          <div>
            <label for="admin-pass">Senha</label>
            <input class="field-input" id="admin-pass" type="password" required value="keu123" />
          </div>
          <button class="btn btn-primary btn-full" type="submit">Entrar</button>
          <p id="login-error" style="display: none; color: #8a1c1c; font-size: 0.8rem">E-mail ou senha inválidos.</p>
        </form>
        <p class="center mt-8">
          <a class="link-gold" href="index.html">← Voltar à loja</a>
        </p>
      </div>
    </section>

    <div class="admin-shell" id="admin-shell">
      <aside class="admin-side">
        <a href="index.html">
          <span class="logo-main">Keu</span>
          <span class="logo-sub">Semijoias</span>
        </a>
        <p style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-secondary-light); margin-top: 1rem">
          Painel admin
        </p>
        <nav class="admin-nav" id="admin-nav">
          <button type="button" class="is-on" data-view="dashboard">Visão geral</button>
          <button type="button" data-view="orders">Pedidos</button>
          <button type="button" data-view="products">Produtos</button>
          <button type="button" data-view="collections">Coleções</button>
          <button type="button" data-view="customers">Clientes</button>
          <button type="button" data-view="messages">Mensagens</button>
          <button type="button" data-view="settings">Aparência</button>
          <button type="button" id="logout">Sair</button>
        </nav>
      </aside>
      <main class="admin-main" id="admin-main"></main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
